name: AI Daily Processing

on:
  schedule:
    # 每天凌晨1-3点，每30分钟执行一次
    - cron: '0,30 1,2,3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD)，默认昨天'
        required: false
        default: ''

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  process:
    runs-on: ubuntu-latest
    name: AI Daily Process
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --upgrade pip requests jq

      - name: Determine target date
        id: date
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            TARGET_DATE="${{ inputs.date }}"
          else
            TARGET_DATE=$(date -d 'yesterday' +%Y-%m-%d)
          fi
          echo "date=$TARGET_DATE" >> $GITHUB_OUTPUT
          echo "📅 处理日期: $TARGET_DATE"

      - name: Get articles from Worker
        id: fetch
        run: |
          echo "📥 获取文章..."
          curl -s -X POST "https://ai-daily-collector.xxl185.workers.dev/mcp" \
            -H "Content-Type: application/json" \
            -d '{"tool": "get_articles_by_date", "arguments": {"date": "'"${{ steps.date.outputs.date }}"'", "limit": 1000}}' \
            -o /tmp/articles.json
          
          ARTICLE_COUNT=$(jq '.articles | length' /tmp/articles.json 2>/dev/null || echo "0")
          echo "✅ 获取文章: $ARTICLE_COUNT 篇"
          echo "count=$ARTICLE_COUNT" >> $GITHUB_OUTPUT

      - name: AI filtering with LLM
        id: filter
        run: |
          python3 << 'ENDOFPYTHON'
          import json, requests
          from concurrent.futures import ThreadPoolExecutor, as_completed
          
          API_KEY = '${{ secrets.SILICONFLOW_API_KEY }}'
          
          with open('/tmp/articles.json') as f:
              data = json.load(f)
          
          articles = data.get('articles', [])
          print(f'文章总数: {len(articles)}')
          
          def is_ai_related(article):
              title = article.get('title', '')[:150]
              json_format = '{"is_ai": true/false}'
              prompt = '文章标题: ' + title + '\n请判断这篇文章是否与AI人工智能相关。\n请直接返回JSON: ' + json_format
              
              try:
                  resp = requests.post(
                      'https://api.siliconflow.cn/v1/chat/completions',
                      headers={'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json'},
                      json={'model': 'Qwen/Qwen2.5-7B-Instruct', 'messages': [{'role': 'user', 'content': prompt}], 'max_tokens': 50},
                      timeout=15
                  )
                  if resp.status_code == 200:
                      content = resp.json()['choices'][0]['message']['content']
                      import re
                      match = re.search(r'"is_ai"\s*:\s*(true|false)', content, re.IGNORECASE)
                      if match:
                          return (article, match.group(1) == 'true')
              except:
                  pass
              # 默认认为AI相关
              return (article, True)
          
          print('使用LLM判断AI相关性...')
          results = []
          with ThreadPoolExecutor(max_workers=10) as executor:
              futures = [executor.submit(is_ai_related, a) for a in articles]
              for f in as_completed(futures):
                  try:
                      results.append(f.result())
                  except:
                      results.append((articles[len(results)], True))
          
          ai_articles = [r[0] for r in results if r[1]]
          non_ai_articles = [r[0] for r in results if not r[1]]
          
          print(f'AI文章: {len(ai_articles)}/{len(articles)}')
          print(f'非AI文章: {len(non_ai_articles)}/{len(articles)}')
          
          with open('/tmp/ai_articles.json', 'w') as f:
              json.dump({'date': data.get('date'), 'count': len(ai_articles), 'articles': ai_articles}, f, ensure_ascii=False)
          
          with open('/tmp/non_ai_articles.json', 'w') as f:
              json.dump({'date': data.get('date'), 'count': len(non_ai_articles), 'articles': non_ai_articles}, f, ensure_ascii=False)
          
          print('✅ AI筛选完成')
          ENDOFPYTHON

      - name: Mark non-AI articles in database
        id: mark-non-ai
        run: |
          python3 << 'ENDOFPYTHON'
          import json, requests, time
          
          with open('/tmp/non_ai_articles.json') as f:
              data = json.load(f)
          
          articles = data.get('articles', [])
          if not articles:
              print('无非AI文章')
              exit(0)
          
          print(f'标记 {len(articles)} 篇非AI文章...')
          
          success = 0
          for a in articles:
              try:
                  r = requests.post('https://ai-daily-collector.xxl185.workers.dev/mcp',
                      json={
                          'tool': 'update_article_summary_and_category',
                          'arguments': {
                              'article_id': a.get('id'),
                              'is_ai_related': False
                          }
                      },
                      timeout=30)
                  if r.status_code == 200:
                      success += 1
              except:
                  pass
              time.sleep(0.03)
          
          print(f'✅ 标记完成: {success}/{len(articles)}')
          ENDOFPYTHON

      - name: LLM processing
        id: llm
        run: |
          python3 << 'ENDOFPYTHON'
          import json, requests, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          
          API_KEY = '${{ secrets.SILICONFLOW_API_KEY }}'
          API_URL = 'https://api.siliconflow.cn/v1/chat/completions'
          
          with open('/tmp/ai_articles.json') as f:
              data = json.load(f)
          
          articles = data.get('articles', [])
          target_date = data.get('date')
          
          print(f'处理 {len(articles)} 篇文章，并发20...')
          
          def process_article(article):
              title = article.get('title', '')[:100]
              prompt = '文章标题: ' + title + '\n请直接返回JSON: {"summary": "50字摘要", "category": "论文/技术/产品/应用/动态/其他", "tags": "3-5标签"}'
              
              try:
                  resp = requests.post(API_URL,
                      headers={'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json'},
                      json={'model': 'Qwen/Qwen2.5-7B-Instruct', 'messages': [{'role': 'user', 'content': prompt}], 'max_tokens': 512},
                      timeout=30)
                  if resp.status_code == 200:
                      content = resp.json()['choices'][0]['message']['content']
                      match = re.search(r'\{[^}]+\}', content, re.DOTALL)
                      if match:
                          llm = json.loads(match.group())
                          return {
                              'id': article.get('id'),
                              'title': article.get('title', ''),
                              'url': article.get('url', ''),
                              'source': article.get('source', ''),
                              'summary': llm.get('summary', ''),
                              'category': llm.get('category', '其他'),
                              'tags': llm.get('tags', '')
                          }
              except:
                  pass
              return article
          
          results = []
          with ThreadPoolExecutor(max_workers=20) as executor:
              futures = [executor.submit(process_article, a) for a in articles]
              for f in as_completed(futures):
                  try:
                      r = f.result()
                      results.append(r)
                      if len(results) % 20 == 0:
                          print(f'进度: {len(results)}/{len(articles)}')
                  except:
                      pass
          
          print(f'LLM处理完成: {len(results)}/{len(articles)}')
          
          cats = {}
          for a in results:
              cat = a.get('category', '其他').split('/')[0]
              cats[cat] = cats.get(cat, 0) + 1
          print('分类:', cats)
          
          with open('/tmp/processed_articles.json', 'w') as f:
              json.dump({'date': target_date, 'count': len(results), 'articles': results}, f, ensure_ascii=False)
          
          print('✅ LLM处理完成')
          ENDOFPYTHON

      - name: Update database
        id: update-db
        run: |
          python3 << 'ENDOFPYTHON'
          import json, requests, time
          
          with open('/tmp/processed_articles.json') as f:
              data = json.load(f)
          
          articles = data.get('articles', [])
          print(f'更新 {len(articles)} 篇文章...')
          
          success = 0
          for a in articles:
              try:
                  r = requests.post('https://ai-daily-collector.xxl185.workers.dev/mcp',
                      json={
                          'tool': 'update_article_summary_and_category',
                          'arguments': {
                              'article_id': a.get('id'),
                              'summary': a.get('summary', ''),
                              'categories': a.get('category', ''),
                              'tags': a.get('tags', ''),
                              'is_ai_related': True
                          }
                      },
                      timeout=30)
                  if r.status_code == 200:
                      success += 1
              except:
                  pass
              time.sleep(0.05)
          
          print(f'✅ 数据库更新完成: {success}/{len(articles)}')
          ENDOFPYTHON

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-${{ steps.date.outputs.date }}
          path: |
            /tmp/articles.json
            /tmp/ai_articles.json
            /tmp/processed_articles.json
          retention-days: 7

      - name: Commit processed data
        run: |
          echo "📝 提交数据..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          TARGET_DATE="${{ steps.date.outputs.date }}"
          
          if [ -f /tmp/processed_articles.json ]; then
            mkdir -p data/processed
            cp /tmp/processed_articles.json "data/processed/${TARGET_DATE}.json"
            git add "data/processed/${TARGET_DATE}.json"
          fi
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "AI Daily: ${TARGET_DATE} processed"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:master || echo "Push failed"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 📊 AI Daily Processing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **日期**: ${{ steps.date.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **触发时间**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "- **触发方式**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **获取文章**: ${{ steps.fetch.outputs.count }} 篇" >> $GITHUB_STEP_SUMMARY
